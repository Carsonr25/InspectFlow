<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @font-face {
        font-family: 'System';
        src: local(-apple-system), local(BlinkMacSystemFont), local('Segoe UI'), local(Roboto);
      }
      .logo-text {
        font-family: System, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 180px;
        font-weight: 900;
        letter-spacing: -8px;
        fill: #f5f5f5;
      }
      .logo-accent {
        fill: #ff6b35;
      }
    </style>
  </defs>

  <!-- Dark background -->
  <rect width="1200" height="300" fill="#0a0a0a"/>

  <!-- INSPECT text -->
  <text x="40" y="220" class="logo-text">INSPECT</text>

  <!-- FLOW text in orange -->
  <text x="760" y="220" class="logo-text logo-accent">FLOW</text>
</svg>